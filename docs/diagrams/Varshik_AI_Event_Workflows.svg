<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
<rect width="100%" height="100%" fill="#f7f9fc"/>
<style>.title{font:700 32px Arial,sans-serif;fill:#172b4d}.subtitle{font:16px Arial,sans-serif;fill:#44546f}.box{fill:#fff;stroke:#456990;stroke-width:2;rx:16}.aws{fill:#fff7e6;stroke:#d99000;stroke-width:2;rx:16}.data{fill:#eaf4ff;stroke:#3478b8;stroke-width:2;rx:16}.text{font:18px Arial,sans-serif;fill:#172b4d;text-anchor:middle}.small{font:14px Arial,sans-serif;fill:#44546f;text-anchor:middle}.arrow{stroke:#456990;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#456990"/></marker></defs>
<text x="60" y="58" class="title">Varshik — AI, ML and Event-Driven Workflows</text><text x="60" y="92" class="subtitle">SageMaker provides predictive-model inference; Bedrock supports generative AI tasks.</text><rect x="60" y="145" width="260" height="100" class="data"/><text x="190.0" y="182.0" class="text">Geospatial / terrain</text><text x="190.0" y="209.0" class="text">feature preparation</text><rect x="380" y="145" width="280" height="100" class="aws"/><text x="520.0" y="182.0" class="text">Amazon SageMaker</text><text x="520.0" y="209.0" class="text">real-time endpoint</text><rect x="720" y="145" width="260" height="100" class="box"/><text x="850.0" y="182.0" class="text">Validate prediction</text><text x="850.0" y="209.0" class="text">and record provenance</text><rect x="1040" y="145" width="280" height="100" class="data"/><text x="1180.0" y="182.0" class="text">Use in analysis</text><text x="1180.0" y="209.0" class="text">and map interface</text><path d="M320,195 L380,195" class="arrow"/><path d="M660,195 L720,195" class="arrow"/><path d="M980,195 L1040,195" class="arrow"/><rect x="60" y="350" width="260" height="100" class="box"/><text x="190.0" y="387.0" class="text">Request: city +</text><text x="190.0" y="414.0" class="text">spot identifier</text><rect x="380" y="350" width="280" height="100" class="aws"/><text x="520.0" y="387.0" class="text">Lambda retrieves</text><text x="520.0" y="414.0" class="text">findings + frames</text><rect x="720" y="350" width="260" height="100" class="aws"/><text x="850.0" y="387.0" class="text">Amazon Bedrock</text><text x="850.0" y="414.0" class="text">Converse API</text><rect x="1040" y="350" width="280" height="100" class="box"/><text x="1180.0" y="387.0" class="text">Schema validation</text><text x="1180.0" y="414.0" class="text">one controlled retry</text><path d="M320,400 L380,400" class="arrow"/><path d="M660,400 L720,400" class="arrow"/><path d="M980,400 L1040,400" class="arrow"/><rect x="280" y="485" width="320" height="90" class="data"/><text x="440.0" y="530.0" class="text">S3 cache for frame checks</text><rect x="760" y="485" width="360" height="90" class="box"/><text x="940.0" y="517.0" class="text">UI labels results as</text><text x="940.0" y="544.0" class="text">AI interpretations</text><path d="M1180,450 L440,485" class="arrow"/><path d="M600,530 L760,530" class="arrow"/><rect x="60" y="660" width="280" height="100" class="aws"/><text x="200.0" y="697.0" class="text">EventBridge Scheduler</text><text x="200.0" y="724.0" class="text">daily at 17:00 IST</text><rect x="400" y="660" width="280" height="100" class="aws"/><text x="540.0" y="697.0" class="text">Lambda + Open-Meteo</text><text x="540.0" y="724.0" class="text">hourly precipitation</text><rect x="740" y="660" width="280" height="100" class="box"/><text x="880.0" y="697.0" class="text">Depth/rainfall curves</text><text x="880.0" y="724.0" class="text">interpolation + caveats</text><rect x="1080" y="660" width="240" height="100" class="aws"/><text x="1200.0" y="710.0" class="text">SNS daily summary</text><path d="M340,710 L400,710" class="arrow"/><path d="M680,710 L740,710" class="arrow"/><path d="M1020,710 L1080,710" class="arrow"/><rect x="240" y="820" width="360" height="90" class="aws"/><text x="420.0" y="852.0" class="text">DynamoDB: VarshikActions</text><text x="420.0" y="879.0" class="text">field actions + observations</text><rect x="760" y="820" width="360" height="90" class="box"/><text x="940.0" y="852.0" class="text">Ground-truth evaluation</text><text x="940.0" y="879.0" class="text">hit rate · depth error</text><path d="M1200,760 L420,820" class="arrow"/><path d="M600,865 L760,865" class="arrow"/><text x="700" y="960" class="small">Forecast thresholds are project-defined advisories, not universal safety standards.</text></svg>