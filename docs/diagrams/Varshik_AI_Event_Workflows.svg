589.0" class="text">interpolation + caveats</text><rect x="1080" y="520" width="240" height="110" class="aws"/><text x="1200.0" y="575.0" class="text">SNS daily summary</text><path d="M340,575 L400,575" class="arrow"/><path d="M680,575 L740,575" class="arrow"/><path d="M1020,575 L1080,575" class="arrow"/><rect x="250" y="740" width="360" height="100" class="aws"/><text x="430.0" y="777.0" class="text">DynamoDB: VarshikActions</text><text x="430.0" y="804.0" class="text">officer decisions + observations</text><rect x="770" y="740" width="360" height="100" class="box"/><text x="950.0" y="777.0" class="text">Ground-truth comparison</text><text x="950.0" y="804.0" class="text">hit rate · depth error</text><path d="M1180,630 L430,740" class="arrow"/><path d="M610,790 L770,790" class="arrow"/><text x="700" y="900" class="small">Forecast thresholds are project-defined advisory rules, not universal safety standards.</text></svg>