t><rect x="550" y="510" width="300" height="105" class="aws"/><text x="700.0" y="549.5" class="text">CloudFront + OAC</text><text x="700.0" y="576.5" class="text">HTTPS delivery</text><rect x="930" y="510" width="300" height="105" class="box"/><text x="1080.0" y="549.5" class="text">React + TypeScript</text><text x="1080.0" y="576.5" class="text">MapLibre UI</text><path d="M1115,435 L320,510" class="arrow"/><path d="M470,562 L550,562" class="arrow"/><path d="M850,562 L930,562" class="arrow"/><rect x="60" y="700" width="270" height="105" class="aws"/><text x="195.0" y="739.5" class="text">Amazon Bedrock</text><text x="195.0" y="766.5" class="text">Vision + officer briefs</text><rect x="370" y="700" width="270" height="105" class="aws"/><text x="505.0" y="739.5" class="text">EventBridge + Lambda</text><text x="505.0" y="766.5" class="text">Scheduled rainfall analysis</text><rect x="680" y="700" width="270" height="105" class="aws"/><text x="815.0" y="739.5" class="text">Amazon SNS</text><text x="815.0" y="766.5" class="text">Daily notifications</text><rect x="990" y="700" width="300" height="105" class="aws"/><text x="1140.0" y="739.5" class="text">Amazon DynamoDB</text><text x="1140.0" y="766.5" class="text">Actions + observations</text><path d="M1080,615 L195,700" class="arrow"/><path d="M1080,615 L505,700" class="arrow"/><path d="M1080,615 L815,700" class="arrow"/><path d="M1080,615 L1140,700" class="arrow"/><text x="700" y="875" class="small">Predictions and AI interpretations are decision-support signals, not verified field measurements.</text></svg>