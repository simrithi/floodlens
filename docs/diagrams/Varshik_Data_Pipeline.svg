<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<rect width="100%" height="100%" fill="#f7f9fc"/>
<style>
.title { font: 700 32px Arial, sans-serif; fill: #172b4d; }
.subtitle { font: 16px Arial, sans-serif; fill: #44546f; }
.box { fill: #ffffff; stroke: #456990; stroke-width: 2; rx: 16; }
