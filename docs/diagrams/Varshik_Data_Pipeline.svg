<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#456990"/></marker></defs>
<text x="60" y="58" class="title">Varshik — Data Pipeline and Application Delivery</text><text x="60" y="92" class="subtitle">Output contracts separate analytical processing from the presentation layer.</text><rect x="60" y="180" width="260" height="120" class="data"/><text x="190.0" y="214.0" class="text">Source inputs</text><text x="190.0" y="241.0" class="text">footage · sensors · DEM</text><text x="190.0" y="268.0" class="text">drainage data</text><rect x="390" y="180" width="260" height="120" class="box"/><text x="520.0" y="227.0" class="text">Python pipeline</text><text x="520.0" y="254.0" class="text">analysis + validation</text><rect x="720" y="120" width="270" height="100" class="data"/><text x="855.0" y="157.0" class="text">JSON</text><text x="855.0" y="184.0" class="text">findings + metadata</text><rect x="720" y="250" width="270" height="100" class="data"/><text x="855.0" y="287.0" class="text">GeoJSON</text><text x="855.0" y="314.0" class="text">flow + kerb + drains</text><rect x="720" y="380" width="270" height="100" class="data"/><text x="855.0" y="417.0" class="text">Images / depth</text><text x="855.0" y="444.0" class="text">frames + overlays</text><path d="M320,240 L390,240" class="arrow"/><path d="M650,220 L720,170" class="arrow"/><path d="M650,240 L720,300" class="arrow"/><path d="M650,260 L720,430" class="arrow"/><rect x="1050" y="210" width="280" height="120" class="aws"/><text x="1190.0" y="257.0" class="text">S3 + CloudFront</text><text x="1190.0" y="284.0" class="text">private origin via OAC</text><path d="M990,170 L1050,240" class="arrow"/><path d="M990,300 L1050,270" class="arrow"/><path d="M990,430 L1050,300" class="arrow"/><rect x="1050" y="440" width="280" height="120" class="box"/><text x="1190.0" y="487.0" class="text">React + TypeScript</text><text x="1190.0" y="514.0" class="text">MapLibre + city reports</text><path d="M1190,330 L1190,440" class="arrow"/><text x="700" y="660" class="small">VITE_ANALYSIS_BASE defaults to /analysis. Validate missing or malformed data at runtime.</text></svg>