<text x="60" y="58" class="title">Varshik — Geospatial Data and Inference Pipeline</text><text x="60" y="92" class="subtitle">Terrain-derived features are processed and sent to a deployed SageMaker real-time endpoint.</text><rect x="50" y="180" width="250" height="115" class="data"/><text x="175.0" y="211.5" class="text">Source inputs</text><text x="175.0" y="238.5" class="text">footage · sensors · DEM</text><text x="175.0" y="265.5" class="text">drainage data</text><rect x="350" y="180" width="250" height="115" class="box"/><text x="475.0" y="224.5" class="text">Python geospatial</text><text x="475.0" y="251.5" class="text">processing + validation</text><rect x="650" y="180" width="280" height="115" class="aws"/><text x="790.0" y="224.5" class="text">Amazon SageMaker</text><text x="790.0" y="251.5" class="text">real-time inference</text><rect x="980" y="180" width="340" height="115" class="data"/><text x="1150.0" y="224.5" class="text">Validated predictions</text><text x="1150.0" y="251.5" class="text">+ JSON / GeoJSON outputs</text><path d="M300,237 L350,237" class="arrow"/><path d="M600,237 L650,237" class="arrow"/><path d="M930,237 L980,237" class="arrow"/><rect x="230" y="390" width="280" height="105" class="aws"/><text x="370.0" y="429.5" class="text">S3 + CloudFront</text><text x="370.0" y="456.5" class="text">private origin via OAC</text><rect x="600" y="390" width="300" height="105" class="box"/><text x="750.0" y="429.5" class="text">React + TypeScript</text><text x="750.0" y="456.5" class="text">MapLibre + city reports</text><rect x="990" y="390" width="300" height="105" class="aws"/><text x="1140.0" y="429.5" class="text">Bedrock workflows</text><text x="1140.0" y="456.5" class="text">visual inspection + briefs</text><path d="M1150,295 L370,390" class="arrow"/><path d="M510,442 L600,442" class="arrow"/><path d="M900,442 L990,442" class="arrow"/><text x="700" y="610" class="small">Keep predictive outputs, generative-AI interpretations, and verified observations distinguishable.</text><text x="700" y="655" class="small">Validate feature schemas, endpoint responses, and missing or out-of-range values.</text></svg>