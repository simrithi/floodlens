name: deploy

# Manual only: Actions -> deploy -> Run workflow. Publishes the web app to the live site.
# It needs the one-time AWS setup described in infra/README.md ("Deploying from GitHub Actions").
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check the deployment is configured
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "AWS_DEPLOY_ROLE_ARN is not set. See infra/README.md, section 'Deploying from GitHub Actions'."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Write the production settings
        run: |
          {
            echo "VITE_ANALYSIS_BASE=/analysis"
            echo "VITE_API_FRAME_CHECK=${{ vars.VITE_API_FRAME_CHECK }}"
            echo "VITE_API_BRIEF=${{ vars.VITE_API_BRIEF }}"
            echo "VITE_API_ACTIONS=${{ vars.VITE_API_ACTIONS }}"
          } > ui/.env.production
      - name: Build, upload and invalidate
        run: bash infra/deploy.sh
